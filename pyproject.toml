[project]
name = "sudden_death"
version = "0.0.1"
description = "突然の死(ハリフキダシ)を生成するツール"
requires-python = "==3.14.9"
dependencies = [
  "click==8.3.3",
  "pyperclip>=1.11.0",
]
[[project.authors]]
name = "koluku"

[dependency-groups]
dev = [
  "black==26.10.1",
  "pylint==4.1.3",
  "sqlfluff==4.4.0",
  "mypy==2.3.1",
  "flake8==7.4.1",
  "importlib-metadata==10.0.0",
  "tomlkit==0.15.2",
  "setuptools==84.2.1",
]

[project.license]
text = "MIT"

[project.urls]
Repository = "https://github.com/koluku/sudden-death"

[tool.uv]
required-version = ">=0.13.5"
[[tool.uv.index]]
url = "https://pypi.flatt.tech/simple/"
default = true

[tool.setuptools.package-data]
sudden_death = [ "py.typed",]
